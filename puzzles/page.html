<!doctype html><html><body style="margin:0;background:#0d0b1a"><canvas id="c" width="1080" height="1920"></canvas>
<script>
const S=__SCRIPT__;
const c=document.getElementById('c'),g=c.getContext('2d');
const F='Inter, "DejaVu Sans", Arial, sans-serif';
const cl=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a))),ease=t=>t*t*(3-2*t),eo=t=>1-Math.pow(1-t,3);
const INTRO=2.0, SEARCH=S.search||5.0, REVEAL=2.2, OUTRO=4.0;
const R=S.rounds.length; window.DUR=INTRO+R*(SEARCH+REVEAL)+OUTRO;
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function face(x,y,r,o,hue,t){ // o = odd flags {hue, frown, eye, tilt}
 g.save();g.translate(x,y);if(o&&o.tilt)g.rotate(0.18);
 const h=(o&&o.hue!==undefined)?o.hue:hue;
 const gr=g.createLinearGradient(-r,-r,r,r);gr.addColorStop(0,`hsl(${h},85%,68%)`);gr.addColorStop(1,`hsl(${h+18},80%,54%)`);
 g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=gr;g.fill();
 g.fillStyle='#231a3d';
 const er=r*0.17, ex=r*0.36, ey=-r*0.2;
 g.beginPath();g.arc(-ex,ey,er,0,7);g.fill();
 g.beginPath();g.arc(ex,ey,(o&&o.eye)?er*0.45:er,0,7);g.fill();
 g.strokeStyle='#231a3d';g.lineWidth=r*0.13;g.lineCap='round';g.beginPath();
 if(o&&o.frown)g.arc(0,r*0.52,r*0.42,Math.PI*1.2,Math.PI*1.8);
 else g.arc(0,r*0.18,r*0.42,Math.PI*0.2,Math.PI*0.8);
 g.stroke();g.restore();
}
function grid(rd,t,phase){ // phase 0=search 1=reveal
 const{cols,rows,odd,hue}=rd;
 const top=560,bot=1420,pad=60;
 const cw=(1080-pad*2)/cols, ch=(bot-top)/rows, r=Math.min(cw,ch)*0.38;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
  const k=j*cols+i, x=pad+cw*(i+0.5), y=top+ch*(j+0.5);
  const isOdd = (i===odd[0]&&j===odd[1]);
  const pop=ease(cl(t,0.02*k,0.02*k+0.35));
  if(pop<=0)continue;
  const bob=Math.sin(t*1.6+k*0.7)*3;
  g.save();g.globalAlpha=phase?(isOdd?1:0.26):1;g.translate(0,bob);
  face(x,y,r*pop,isOdd?rd.diff:null,hue,t);g.restore();
  if(phase&&isOdd){const p=eo(cl(t,0,0.5));g.save();g.strokeStyle='#ffd166';g.lineWidth=9;
   g.beginPath();g.arc(x,y+bob,r*(1.5+0.5*(1-p))+8*Math.sin(t*7),0,7);g.stroke();
   g.globalAlpha=0.35;g.lineWidth=22;g.stroke();g.restore()}
 }
}
function timerBar(p){const w=820;g.save();
 g.beginPath();g.roundRect(130,1470,w,26,13);g.fillStyle='rgba(255,255,255,0.14)';g.fill();
 const col=p>0.6?'#ff6b8a':(p>0.3?'#ffd166':'#7ef0c0');
 g.beginPath();g.roundRect(130,1470,w*(1-p),26,13);g.fillStyle=col;g.fill();g.restore();
 g.fillStyle='#fff';g.font='bold 40px '+F;g.textAlign='center';g.fillText(Math.ceil(SEARCH*(1-p)),540,1555);}
function frame(t){
 const bg=g.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#1a1430');bg.addColorStop(1,'#0b0916');
 g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 for(let i=0;i<40;i++){const x=rnd(i)*1080,y=(rnd(i+5)*1920+t*12)%1920;g.fillStyle='rgba(255,255,255,0.07)';g.beginPath();g.arc(x,y,3+rnd(i+9)*4,0,7);g.fill()}
 g.textAlign='center';g.textBaseline='middle';
 let tt=t-INTRO, idx=Math.floor(tt/(SEARCH+REVEAL)), lt=tt-idx*(SEARCH+REVEAL);
 const outro = idx>=R;
 if(t<INTRO){const a=ease(cl(t,0.1,0.9));g.save();g.globalAlpha=a;
  g.fillStyle='#fff';g.font='bold 86px '+F;g.fillText(S.title,540,860);
  g.fillStyle='#ffd166';g.font='bold 48px '+F;g.fillText(S.sub,540,960);g.restore();}
 else if(!outro){const rd=S.rounds[idx], phase=lt>SEARCH?1:0;
  g.fillStyle='#fff';g.font='bold 60px '+F;g.fillText('ROUND '+(idx+1),540,330);
  g.fillStyle='#ffd166';g.font='bold 40px '+F;g.fillText(rd.prompt,540,410);
  grid(rd,phase?lt-SEARCH:lt,phase);
  if(!phase)timerBar(lt/SEARCH);
  else{const a=ease(cl(lt-SEARCH,0,0.3));g.save();g.globalAlpha=a;g.fillStyle='#7ef0c0';g.font='bold 62px '+F;
   g.fillText(idx<R-1?'THERE IT IS':'FINAL ONE',540,1510);g.restore()}}
 else{const a=ease(cl(tt-R*(SEARCH+REVEAL),0.1,0.8));g.save();g.globalAlpha=a;
  g.fillStyle='#fff';g.font='bold 76px '+F;g.fillText('How many did',540,800);g.fillText('you spot?',540,890);
  g.beginPath();g.roundRect(250,980,580,150,40);g.fillStyle='rgba(255,255,255,0.08)';g.fill();
  g.strokeStyle='#ffd166';g.lineWidth=4;g.stroke();
  g.fillStyle='#ffd166';g.font='bold 70px '+F;g.fillText('0 · 1 · 2 · 3',540,1060);
  g.fillStyle='#cfc9e8';g.font='38px '+F;g.fillText('Comment your score',540,1200);g.restore()}
 g.beginPath();g.roundRect(150,1640,780,86,24);g.fillStyle='rgba(255,255,255,0.09)';g.fill();
 g.fillStyle='#fff';g.font='bold 30px '+F;g.fillText(S.footer,540,1670);
 g.fillStyle='#b9b2d8';g.font='26px '+F;g.fillText('New puzzle every day',540,1706);
 const fo=cl(t,window.DUR-0.7,window.DUR);if(fo>0){g.fillStyle=`rgba(0,0,0,${fo})`;g.fillRect(0,0,1080,1920)}
 return c.toDataURL('image/jpeg',0.92).split(',')[1];
}
window.frame=frame;
</script></body></html>
